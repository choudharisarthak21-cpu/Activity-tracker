version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: activity_tracker_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=activity_tracker

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: activity_tracker_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/activity_tracker
      - JWT_SECRET=super_secret_activity_tracker_jwt_key_2026_modern_secure
      - JWT_EXPIRE=30d
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: activity_tracker_frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
